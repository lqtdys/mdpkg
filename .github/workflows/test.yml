name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mdpkg/package-lock.json
      - run: npm ci
        working-directory: packages/mdpkg
      - run: node --test test/*.test.ts
        working-directory: packages/mdpkg