<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdpkg 网页打开器 · 演示</title>
<script src="./mdpkg-web.iife.js"></script>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; color: #1f2328; background: #f6f8fa; }
header { padding: 1.2rem 1.5rem; background: #fff; border-bottom: 1px solid #d0d7de; }
header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
header p { margin: .2rem 0 0; color: #57606a; font-size: .85rem; }
main { max-width: 1080px; margin: 1.5rem auto; padding: 0 1.5rem; }
#drop {
  border: 2px dashed #d0d7de; border-radius: 10px; background: #fff;
  padding: 3rem 1rem; text-align: center; color: #57606a; cursor: pointer; transition: border-color .15s, background .15s;
}
#drop.drag { border-color: #0969da; background: #f0f6ff; }
#drop strong { display: block; font-size: 1.05rem; color: #1f2328; margin-bottom: .3rem; }
#status { margin: 1rem 0; font-size: .9rem; }
#panel { display: none; }
#result { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 1rem; align-items: start; }
.card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem 1.25rem; }
.card h2 { margin: 0 0 .8rem; font-size: .95rem; font-weight: 600; }
.badge { display: inline-block; padding: .2em .6em; border-radius: 999px; font-size: .8rem; font-weight: 600; }
.badge.ok { background: #dafbe1; color: #1a7f37; }
.badge.bad { background: #ffebe9; color: #cf222e; }
.badge.warn { background: #fff8c5; color: #9a6700; }
ul.errors, ul.warnings { margin: .5rem 0 0; padding-left: 1.2em; font-size: .85rem; }
ul.errors { color: #cf222e; }
ul.warnings { color: #9a6700; }
#entries { margin: 0; padding: 0; list-style: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; max-height: 340px; overflow-y: auto; }
#entries li { padding: .25rem 0; border-bottom: 1px solid #f0f3f6; display: flex; justify-content: space-between; gap: 1rem; }
#entries .sz { color: #57606a; flex-shrink: 0; }
#preview { border: 0; width: 100%; height: 70vh; background: #fff; border-radius: 8px; }
#errbox { display: none; background: #ffebe9; border: 1px solid #ff818266; color: #cf222e; border-radius: 8px; padding: 1rem 1.25rem; margin-top: 1rem; font-size: .9rem; white-space: pre-wrap; }
#meta { font-size: .82rem; color: #57606a; margin-top: .8rem; line-height: 1.6; }
#meta code { background: #f6f8fa; padding: .1em .35em; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>mdpkg 网页打开器</h1>
  <p>拖入 .mdpkg 文件 → 解包 + 校验 + 渲染。全部在浏览器本地完成，不上传。</p>
</header>
<main>
  <div id="drop">
    <strong>拖入 .mdpkg 文件，或点击选择</strong>
    <span>也可用下方按钮选择文件</span>
    <input type="file" accept=".mdpkg,.zip" id="file" hidden>
  </div>
  <div id="status"></div>
  <div id="errbox"></div>
  <div id="panel">
    <div id="result">
      <div>
        <div class="card">
          <h2>校验结果 <span id="vbadge"></span></h2>
          <ul class="errors" id="verrors"></ul>
          <ul class="warnings" id="vwarnings"></ul>
          <div id="meta"></div>
        </div>
        <div class="card" style="margin-top:1rem">
          <h2>包内条目（<span id="ecount">0</span>）</h2>
          <ul id="entries"></ul>
        </div>
      </div>
      <div class="card">
        <h2>渲染预览</h2>
        <iframe id="preview" sandbox="allow-same-origin"></iframe>
      </div>
    </div>
  </div>
</main>
<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const statusEl = document.getElementById('status');
const panel = document.getElementById('panel');
const errbox = document.getElementById('errbox');

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('drag'); openFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => openFile(fileInput.files[0]));

async function openFile(f) {
  if (!f) return;
  errbox.style.display = 'none';
  statusEl.textContent = `正在打开 ${f.name}（${(f.size / 1048576).toFixed(1)} MB）…`;
  try {
    const buf = new Uint8Array(await f.arrayBuffer());
    const r = MdpkgWeb.openMdpkg(buf);
    r.then(showResult).catch(showError);
  } catch (e) { showError(e); }
}

function showError(e) {
  statusEl.textContent = '';
  errbox.style.display = 'block';
  errbox.textContent = String(e && e.message ? e.message : e);
}

function showResult(r) {
  statusEl.textContent = '';
  panel.style.display = 'block';
  if (r.unverified) statusEl.textContent = '⚠ 未校验来源（缺少 manifest.json），按规则推断入口 ' + (r.entry || '—');

  const v = r.validation;
  const badge = document.getElementById('vbadge');
  badge.className = 'badge ' + (v.ok ? 'ok' : 'bad');
  badge.textContent = v.ok ? 'OK' : (r.unverified ? '未校验' : 'FAIL');
  badge.title = r.unverified ? '缺少 manifest.json，内容已按推断入口渲染' : '';
  document.getElementById('verrors').innerHTML = v.errors.map((e) => '<li>' + esc(e) + '</li>').join('');
  document.getElementById('vwarnings').innerHTML = v.warnings.map((w) => '<li>' + esc(w) + '</li>').join('');

  document.getElementById('meta').innerHTML =
    '格式 ' + esc(r.manifest?.format ?? '-') + ' · spec ' + esc(r.manifest?.spec_version ?? '-') +
    ' · 入口 <code>' + esc(r.manifest?.entrypoint ?? 'document.md') + '</code> · 外部引用 ' + v.externalCount +
    (r.degraded ? ' · <b>包过大已降级</b>' : '');

  document.getElementById('ecount').textContent = String(r.files.size);
  const entries = [...r.files.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
  document.getElementById('entries').innerHTML = entries
    .map(([p, d]) => '<li><span>' + esc(p) + '</span><span class="sz">' + (d.length / 1024).toFixed(1) + ' KB</span></li>')
    .join('');

  const preview = document.getElementById('preview');
  if (r.html) {
    preview.srcdoc = r.html;
  } else if (r.error) {
    preview.srcdoc = '<pre style="font-family:monospace;padding:2rem;color:#cf222e">' + esc(r.error) + '</pre>';
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
</script>
</body>
</html>
